<!doctype html>
<html lang="{{ Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ Title }} | {{ SiteName }}</title>
    <meta name="description" content="{{ Description }}" />
    <!-- Demo stran izmišljenega podjetja: ne sme se pojaviti v Googlu. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="{{ site.theme_color }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{ site.locale }}" />
    <meta property="og:site_name" content="{{ SiteName }}" />
    <meta property="og:title" content="{{ Title }} | {{ SiteName }}" />
    <meta property="og:description" content="{{ Description }}" />
    <meta property="og:url" content="{{ PageUrl }}" />
    <meta property="og:image" content="{{ site.url }}/images/deljenje.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ SiteName }} – {{ site.tagline }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="{{ PageUrl }}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link href="/index.css" rel="stylesheet" />
  </head>

  <body>
    <p class="demo-banner">{{ site.demo_note }} <a href="https://github.com/milinkovicluka">Luka Milinković</a>.</p>
    <header class="site-header">
      <div class="header-row">
        <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 26 L12 10 L17 17 L21 12 L30 26 Z" fill="currentColor"/><path d="M12 10 L14.5 14 L12 13 L9.6 13.9 Z" fill="#fff"/></svg>{{ SiteName }}</a>
        <nav class="site-nav" aria-label="{{ site.ui_menu }}">{{ Nav }}</nav>
        <a class="btn btn-header" href="/kontakt#povprasevanje">{{ site.ui_check_availability }}</a>
      </div>
    </header>

    <main>
      <article>{{ Content }}</article>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-brand">{{ SiteName }}</p>
        <p>{{ site.tagline }}<br />{{ site.location }}</p>
        <p class="footer-links">
          <a href="tel:{{ site.phone }}">{{ site.phone_display }}</a>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        </p>
      </div>
    </footer>

    <nav class="mobile-bar" aria-label="{{ site.ui_quick }}">
      <a href="tel:{{ site.phone }}">{{ site.ui_call }}</a>
      <a href="https://wa.me/{{ site.whatsapp }}" rel="noopener">WhatsApp</a>
      <a class="mobile-bar-main" href="/kontakt#povprasevanje">{{ site.ui_inquiry }}</a>
    </nav>
  </body>
</html>
